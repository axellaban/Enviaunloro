<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<!-- El perico, de frente y sobre lima.
     
     TRES DECISIONES, y las tres se tomaron mirando el ícono a 24, 40 y 60 px,
     que es como se ve de verdad y no como se ve mientras uno lo dibuja.
     
     1. EL FONDO LLEVA EL COLOR. Antes era casi negro con el bicho encima, y en
        una pantalla de inicio llena de íconos de colores eso es un rectángulo
        oscuro más: no se encuentra. El lima es el color de la app y acá hace de
        campo. Es lo que hacen WhatsApp, Telegram y Spotify, y por lo mismo.
     
     2. SOLO LA CABEZA, centrada y entera. El dibujo anterior metía el cuerpo,
        la cola, el ala y unas líneas de velocidad, y no entraban: el bicho
        quedaba recortado contra la esquina de abajo a la izquierda con medio
        cuadro vacío arriba. A 40 px era una mancha verde con un punto naranja.
        Cuerpo y ala se fueron enteros; lo que se lee chico es la cara.
     
     3. EL AMARILLO NO ES ADORNO. Contra el fondo lima, la cabeza tiene que ser
        oscura para contrastar — y una cabeza oscura con pico naranja se lee
        cuervo, no loro. El arco amarillo alrededor del ojo es lo único que dice
        de qué especie es esto, y contrasta contra la cabeza, que es donde tiene
        que contrastar. Probado sin él: se pierde a los 60 px. -->
<defs>
  <linearGradient id="campo" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#c9f77a"/><stop offset="1" stop-color="#7ec213"/>
  </linearGradient>
</defs>
<rect width="120" height="120" rx="26" fill="url(#campo)"/>
<!-- data-bicho: scripts/iconos.mjs le achica esta escala para armar el ícono
     enmascarable de Android, que necesita el dibujo adentro del 80% central. -->
<g data-bicho transform="translate(59 62) scale(2.0) translate(-86 -41)">
  <path d="M75 31 C71 20 82 17 82.5 29 Z" fill="#15412a"/>
  <path d="M82.5 29 C83 18 93 20 89 32 Z" fill="#15412a"/>
  <circle cx="82" cy="45" r="16" fill="#15412a"/>
  <path d="M70 46 C69 34 78 29 88 32 C83 37 80 44 80 52 Z" fill="#facc15"/>
  <g transform="translate(90 46) scale(0.98)">
    <path d="M-6 -9 C10 -10 18 -1 15 8 C13 15 6 16 3 10 C0 5 -3 -1 -6 -9 Z" fill="#fb923c"/>
    <path d="M1 8 C5 15 14 14 14 7 C10 11 5 11 1 8 Z" fill="#ea580c"/>
  </g>
  <circle cx="82.6" cy="40" r="6.8" fill="#ffffff"/>
  <circle cx="84.4" cy="40.4" r="3.8" fill="#0b1a16"/>
  <circle cx="85.9" cy="38.1" r="1.6" fill="#ffffff"/>
</g>
</svg>
